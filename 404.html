<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Film Lab | 404 — Frame Not Found</title>
  <link rel="icon" href="/assets/fav.png" type="image/jpeg">
  <meta name="description" content="Page not found — The frame you're looking for seems to be missing from our darkroom. Return to Film Lab's analog photography studio.">
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&family=Lato:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in { animation: fadeInUp 0.8s ease-out forwards; }
    .delay-1 { animation-delay: 0.1s; opacity: 0; animation-fill-mode: forwards; }
    .delay-2 { animation-delay: 0.2s; opacity: 0; animation-fill-mode: forwards; }
    .delay-3 { animation-delay: 0.3s; opacity: 0; animation-fill-mode: forwards; }
    .delay-4 { animation-delay: 0.4s; opacity: 0; animation-fill-mode: forwards; }
    .delay-5 { animation-delay: 0.5s; opacity: 0; animation-fill-mode: forwards; }

    @keyframes flicker {
      0%, 100% { opacity: 1; text-shadow: 0 0 5px rgba(155,123,76,0.5); }
      50% { opacity: 0.7; text-shadow: 0 0 20px rgba(155,123,76,0.8); }
    }
    .flicker {
      animation: flicker 2.5s ease-in-out infinite;
    }

    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-0.5%, -0.5%); }
      20% { transform: translate(0.5%, 0.5%); }
      30% { transform: translate(-0.5%, 0.5%); }
      40% { transform: translate(0.5%, -0.5%); }
      50% { transform: translate(-0.3%, -0.3%); }
      60% { transform: translate(0.3%, 0); }
      70% { transform: translate(0, 0.3%); }
      80% { transform: translate(-0.5%, -0.2%); }
      90% { transform: translate(0.5%, 0.2%); }
    }
    .grain-overlay::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIj48ZmlsdGVyIGlkPSJmIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iLjgiIG51bU9jdGF2ZXM9IjMiLz48L2ZpbHRlcj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWx0ZXI9InVybCgjZikiIG9wYWNpdHk9IjAuMTIiLz48L3N2Zz4=');
      background-repeat: repeat;
      background-size: 200px;
      z-index: 100;
      opacity: 0.5;
      animation: grain 6s steps(8) infinite;
    }

    @keyframes shutterClick {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }
    .camera-icon:hover {
      animation: shutterClick 0.3s ease;
    }

    @media (max-width: 640px) {
      .flicker-text {
        font-size: 100px !important;
      }
    }
  </style>
</head>
<body class="font-sans text-gray-700 antialiased bg-black grain-overlay relative min-h-screen overflow-x-hidden">

  <!-- Cinematic Background Layer -->
  <div class="fixed inset-0 z-0">
    <img src="https://images.unsplash.com/photo-1510127034890-b3e8b4b2a21f?auto=format&fit=crop&q=90&w=2000" 
         alt="Darkroom film grain texture" 
         class="w-full h-full object-cover object-center">
    <div class="absolute inset-0 bg-gradient-to-br from-black/85 via-black/70 to-black/90"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-black/30"></div>
  </div>

  <!-- Main 404 Content -->
  <main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-4 py-12 sm:py-16 md:py-20">
    <div class="text-center max-w-3xl mx-auto w-full">
      
      <!-- 404 Animated Number with Film Strip Effect -->
      <div class="relative mb-6 sm:mb-8 md:mb-10">
        <div class="text-[100px] sm:text-[140px] md:text-[180px] lg:text-[220px] font-serif font-bold text-theme-gold/15 absolute inset-0 flex items-center justify-center flicker">
          404
        </div>
        <div class="text-[100px] sm:text-[140px] md:text-[180px] lg:text-[220px] font-serif font-bold text-white relative z-10 animate-fade-in flicker-text" style="color: #9B7B4C;">
          404
        </div>
        <!-- Film sprocket holes decoration -->
        <div class="absolute -left-4 sm:-left-8 top-1/2 -translate-y-1/2 flex flex-col gap-2 sm:gap-3">
          <div class="w-2 h-4 sm:w-3 sm:h-6 bg-[#9B7B4C]/30 rounded-full"></div>
          <div class="w-2 h-4 sm:w-3 sm:h-6 bg-[#9B7B4C]/50 rounded-full"></div>
          <div class="w-2 h-4 sm:w-3 sm:h-6 bg-[#9B7B4C]/30 rounded-full"></div>
        </div>
        <div class="absolute -right-4 sm:-right-8 top-1/2 -translate-y-1/2 flex flex-col gap-2 sm:gap-3">
          <div class="w-2 h-4 sm:w-3 sm:h-6 bg-[#9B7B4C]/30 rounded-full"></div>
          <div class="w-2 h-4 sm:w-3 sm:h-6 bg-[#9B7B4C]/50 rounded-full"></div>
          <div class="w-2 h-4 sm:w-3 sm:h-6 bg-[#9B7B4C]/30 rounded-full"></div>
        </div>
      </div>

     

      <!-- Error Message -->
      <h1 class="text-xl sm:text-2xl md:text-3xl lg:text-4xl font-serif font-bold text-white mb-3 animate-fade-in delay-2">
        Frame Not Found
      </h1>
     
      <!-- Film Strip Divider -->
      <div class="flex justify-center gap-1.5 sm:gap-2 mb-8 sm:mb-10 animate-fade-in delay-4">
        <div class="w-1.5 h-6 sm:w-2 sm:h-8 bg-[#9B7B4C]/30 rounded-full"></div>
        <div class="w-1.5 h-6 sm:w-2 sm:h-8 bg-[#9B7B4C]/50 rounded-full"></div>
        <div class="w-1.5 h-6 sm:w-2 sm:h-8 bg-[#9B7B4C] rounded-full"></div>
        <div class="w-1.5 h-6 sm:w-2 sm:h-8 bg-[#9B7B4C]/50 rounded-full"></div>
        <div class="w-1.5 h-6 sm:w-2 sm:h-8 bg-[#9B7B4C]/30 rounded-full"></div>
      </div>

      <!-- Quick Navigation Links - Only Home and Contact -->
      <div class="grid grid-cols-2 gap-3 sm:gap-4 max-w-xs sm:max-w-md mx-auto mb-8 sm:mb-10 animate-fade-in delay-5">
        <a href="index.html" class="group flex flex-col items-center p-3 sm:p-4 bg-white/5 backdrop-blur-sm rounded-xl border border-white/10 hover:border-[#9B7B4C] transition-all duration-300 hover:-translate-y-1">
          <i class="fas fa-home text-xl sm:text-2xl text-[#9B7B4C] mb-1 sm:mb-2 group-hover:scale-110 transition-transform"></i>
          <span class="text-[10px] sm:text-xs text-gray-300 uppercase tracking-wider">Home</span>
        </a>
        <a href="contact.html" class="group flex flex-col items-center p-3 sm:p-4 bg-white/5 backdrop-blur-sm rounded-xl border border-white/10 hover:border-[#9B7B4C] transition-all duration-300 hover:-translate-y-1">
          <i class="fas fa-envelope text-xl sm:text-2xl text-[#9B7B4C] mb-1 sm:mb-2 group-hover:scale-110 transition-transform"></i>
          <span class="text-[10px] sm:text-xs text-gray-300 uppercase tracking-wider">Contact</span>
        </a>
      </div>

      <!-- Back to Home Button - Prominent -->
      <div class="animate-fade-in delay-5">
        <a href="index.html" class="group inline-flex items-center gap-3 bg-[#9B7B4C] hover:bg-[#7A5E3A] text-white px-6 sm:px-8 py-3 sm:py-4 rounded-full text-xs sm:text-sm font-bold uppercase tracking-widest transition-all duration-300 shadow-lg hover:shadow-xl hover:-translate-y-0.5">
          <i class="fas fa-arrow-left text-xs sm:text-sm group-hover:-translate-x-1 transition-transform"></i>
          Back to Darkroom
          <i class="fas fa-camera text-xs sm:text-sm group-hover:translate-x-1 transition-transform"></i>
        </a>
      </div>

    
    </div>
  </main>

</body>
</html>
